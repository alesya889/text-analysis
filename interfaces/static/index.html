<!DOCTYPE html>
<html lang="en">
<head>
  <title>Text Analyzer</title>

  <meta charset="utf-8">
  <!-- <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1"> -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div class="container" >
    <div class="row">
      <div class="col-12">
        <h2>Анализатор текста</h2>
        <p class="subtitle">Определяем сложность, тональность и статистику</p>
      </div>
      <div class="controls">
        <textarea id="textInput" class="form-control" placeholder="Введите текст..." rows="5"></textarea>
        <button id="analyzeBtn" class="btn btn-outline-primary">🔍 Анализировать</button>
        <button id="clearBtn" class="btn btn-outline-danger">🗑️ Очистить</button>
        <button id="exampleBtn" class="btn btn-outline-info">📝 Пример</button>
      </div>

      <div id="result" style="display: none;">
        <h2>Результаты</h2>
        <div id="resultContent"></div>
      </div>
      <div id="loading" style="display: none;">
        ⏳ Анализируем...
      </div>

      <script src="script.js"></script>
    </div>
  </div>
</body>
</html>
